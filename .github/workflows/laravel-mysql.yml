name: Laravel MySQL Target CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    name: Laravel foundation on MySQL 8/InnoDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: a3_tracker_test
          MYSQL_USER: a3_tracker
          MYSQL_PASSWORD: development_only
          MYSQL_ROOT_PASSWORD: root_development_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_development_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: --no-interaction --prefer-dist
      - name: Configure test environment
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/DB_PORT=3307/DB_PORT=3306/; s/DB_DATABASE=a3_tracker/DB_DATABASE=a3_tracker_test/' .env
          php artisan key:generate --force
      - name: Migrate and test
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: a3_tracker_test
          DB_USERNAME: a3_tracker
          DB_PASSWORD: development_only
        run: php artisan migrate:fresh --force && php artisan test
