jobs:
  cleanup:
    name: Guarded obsolete-release cleanup
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "delete" ] && [ "${{ inputs.confirm }}" != "DELETE-48-OBSOLETE-RELEASES" ]; then
            echo "::error::mode=delete requires the exact confirmation string"; exit 1
          fi

      - name: Set up SSH (strict host key checking, key never printed)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Dry-run checks, then (only if mode=delete) guarded removal
        env:
          PROTECTED_LIST: ${{ env.PROTECTED }}
          ALLOW_LIST: ${{ env.ALLOWLIST }}
        run: |
          # ssh re-splits arguments on spaces, so the lists travel comma-separated.
          PROTECTED_CSV="${PROTECTED_LIST// /,}"; ALLOW_CSV="${ALLOW_LIST// /,}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" bash -s -- \
            "${{ env.APP_ROOT }}" "${{ env.EXPECTED_ACTIVE }}" "${{ inputs.mode }}" "$PROTECTED_CSV" "$ALLOW_CSV" <<'REMOTE'
          set -euo pipefail
          APP="$1"; EXPECTED_ACTIVE="$2"; MODE="$3"; PROTECTED="${4//,/ }"; ALLOW="${5//,/ }"
          [ "$(echo $PROTECTED | wc -w)" = "5" ] || { echo "SAFETY_CHECK_FAILED: expected 5 protected releases"; exit 1; }
          fail() { echo "SAFETY_CHECK_FAILED: $*"; exit 1; }
          cnt() { find "$1" -xdev 2>/dev/null | wc -l; }

          [ "$(readlink -f "$APP")" = "/home/u777904340/a3-production-app" ] || fail "app root canonical path"
          { [ ! -L "$APP/releases" ] && [ -d "$APP/releases" ]; } || fail "releases is not a real directory"
          REL="$(readlink -f "$APP/releases")"
          [ "$REL" = "$APP/releases" ] || fail "releases canonical path"

          [ -L "$APP/current" ] || fail "current is not a symlink"
          CUR="$(readlink -f "$APP/current")"
          echo "CURRENT_TARGET=$CUR"
          [ "$CUR" = "$REL/$EXPECTED_ACTIVE" ] || fail "active release is not the expected one"

          echo "--- protected releases"
          for p in $PROTECTED; do
            [[ "$p" =~ ^[0-9a-f]{40}$ ]] || fail "bad protected sha $p"
            { [ -d "$REL/$p" ] && [ ! -L "$REL/$p" ]; } || fail "protected release missing or symlink: $p"
            [ "$(readlink -f "$REL/$p")" = "$REL/$p" ] || fail "protected canonical mismatch: $p"
            echo "PROTECTED $p"
          done

          echo "--- symlinks under app root (depth 2)"
          find "$APP" -maxdepth 2 -type l -printf '%p -> %l\n'
          OTHER_LINKS="$(find "$APP" -maxdepth 2 -type l ! -path "$APP/current" -printf '%l\n' | grep -c "/releases/" || true)"
          [ "$OTHER_LINKS" = "0" ] || fail "another symlink references a release"

          echo "--- candidates"
          N=0; TOTAL_FILES=0; TOTAL_KB=0; LIST=""
          for c in $ALLOW; do
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || fail "bad candidate name $c"
            case " $PROTECTED " in *" $c "*) fail "candidate is protected: $c";; esac
            P="$REL/$c"
            [ -e "$P" ] || fail "candidate missing (inspection list out of date): $c"
            [ ! -L "$P" ] || fail "candidate is a symlink: $c"
            [ -d "$P" ] || fail "candidate is not a directory: $c"
            [ "$(readlink -f "$P")" = "$P" ] || fail "candidate canonical mismatch: $c"
            [ "$P" != "$CUR" ] || fail "candidate is the active release: $c"
            [ -d "$P/backend" ] || fail "unexpected structure (no backend/): $c"
            f="$(cnt "$P")"; kb="$(du -sk "$P" | cut -f1)"
            TOTAL_FILES=$((TOTAL_FILES+f)); TOTAL_KB=$((TOTAL_KB+kb)); N=$((N+1))
            echo "CANDIDATE $c files=$f kb=$kb"
            LIST="$LIST $c"
          done
          echo "CANDIDATE_COUNT=$N"
          echo "RECOVERABLE_FILES=$TOTAL_FILES"
          echo "RECOVERABLE_MB=$((TOTAL_KB/1024))"
          [ "$N" = "48" ] || fail "expected 48 candidates, got $N"
          echo "BEFORE releases=$(ls -1 "$REL" | wc -l) release_files=$(cnt "$REL") home_entries=$(cnt "$HOME")"
          echo "DRY_RUN_CHECKS=PASS"

          if [ "$MODE" != "delete" ]; then echo "MODE=dry-run (nothing deleted)"; exit 0; fi

          echo "--- deleting (each target revalidated immediately before removal)"
          D=0
          for c in $LIST; do
            P="$REL/$c"
            { [ -d "$P" ] && [ ! -L "$P" ] && [ "$(readlink -f "$P")" = "$P" ] && [ "$P" != "$(readlink -f "$APP/current")" ]; } || fail "revalidation failed: $c"
            case " $PROTECTED " in *" $c "*) fail "protected at delete time: $c";; esac
            rm -rf --one-file-system -- "$P"
            [ ! -e "$P" ] || fail "not removed: $c"
            D=$((D+1))
          done
          echo "DELETED=$D"
          [ "$(readlink -f "$APP/current")" = "$CUR" ] || fail "current changed"
          [ -d "$CUR" ] || fail "active release vanished"
          for p in $PROTECTED; do [ -d "$REL/$p" ] || fail "protected missing after cleanup: $p"; done
          echo "AFTER releases=$(ls -1 "$REL" | wc -l) release_files=$(cnt "$REL") home_entries=$(cnt "$HOME")"
          echo "CURRENT_AFTER=$(readlink -f "$APP/current")"
          echo "SHARED_PRESENT=$([ -d "$APP/shared" ] && echo yes || echo NO) BACKUPS_PRESENT=$([ -d "$APP/backups" ] && echo yes || echo NO)"
          echo "CLEANUP=PASS"
          REMOTE

      - name: Production health after run
        run: |
          set -euo pipefail
          curl -fsS https://a3.ciptagrafika.com/api/v1/health
          echo
          curl -fsS https://a3.ciptagrafika.com/api/v1/version
