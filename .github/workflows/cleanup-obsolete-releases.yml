name: Guarded Release Cleanup

# Temporary, manually triggered cleanup of OBSOLETE A3 deployment release directories only.
# Reuses the deployment workflow's Hostinger secrets (the production environment); creates no credentials,
# never deploys, never migrates, and touches nothing outside a3-production-app/releases. It deletes ONLY the
# exact allowlisted release names below, each revalidated immediately before removal. Default mode is a dry run;
# deletion needs mode=delete AND the exact confirmation string, and the dry-run checks run again first.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or delete"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, delete]
      confirm:
        description: "For mode=delete type exactly: DELETE-48-OBSOLETE-RELEASES"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_ROOT: /home/u777904340/a3-production-app
  EXPECTED_ACTIVE: 19741062c4f1ee17988629fa58e79dab425d9940
  PROTECTED: >-
    19741062c4f1ee17988629fa58e79dab425d9940
    8218778904e56b5327c905ffa605019c65394b60
    c3a7def2e52162c77a465bc99349f6479bca22aa
    6af442a68341f8685cd6f38c2a227e80be6f1724
    66130c3eecd33e46da78b184cc4533c013a4c1e1
  ALLOWLIST: >-
    eb815065786528293c36ce5123b7ca8248637721
    9205e4bcabbf0baf89c22e06fee146bb30fe68a0
    f22a96e4cdf5a933b566b2784927ca532a7d6334
