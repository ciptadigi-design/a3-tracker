name: Inspect Production Storage

# Temporary, manually triggered, READ-ONLY inspection of Hostinger disk usage. It reuses the deployment
# workflow's Hostinger secrets (the `production` environment), creates no credentials, never deploys,
# never migrates and never deletes anything: only df/du/readlink/ls/stat style commands that print
# paths, sizes and timestamps. It never reads .env, keys, database credentials or uploaded file contents.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_ROOT: /home/u777904340/a3-production-app

jobs:
  inspect:
    name: Read-only storage inspection
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Set up SSH (strict host key checking, key never printed)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect (read-only)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" bash -s -- "${{ env.APP_ROOT }}" <<'REMOTE'
          set -u
          APP="$1"
          sec() { echo; echo "=== $1"; }
          sz() { du -sh -- "$1" 2>/dev/null | cut -f1; }

          sec "QUOTA AND FILESYSTEM"
          (quota -s 2>&1 || echo "quota: unavailable") | head -8
          df -h "$HOME" | tail -2
          echo "HOME_TOTAL_USED=$(sz "$HOME")"
          echo "INODES:"; df -i "$HOME" | tail -1

          sec "ACCOUNT TOP-LEVEL SIZES (largest first)"
          for p in "$HOME"/* "$HOME"/.[!.]*; do [ -e "$p" ] && printf '%s\t%s\n' "$(sz "$p")" "$p"; done | sort -rh | head -15

          sec "APP ROOT ENTRIES"
          for p in "$APP"/* "$APP"/.[!.]*; do [ -e "$p" ] || [ -L "$p" ] || continue; printf '%s\t%s\n' "$(sz "$p")" "$p"; done | sort -rh | head -30

          sec "CURRENT SYMLINK"
          ls -ld "$APP/current"
          CUR="$(readlink -f "$APP/current")"
          echo "ACTIVE_RELEASE_CANONICAL=$CUR"
          echo "ACTIVE_RELEASE_SIZE=$(sz "$CUR")"

          sec "OTHER SYMLINKS IN APP ROOT AND RELEASES"
          find "$APP" -maxdepth 2 -type l -printf '%p -> %l\n' 2>/dev/null | head -20

          sec "RELEASES (name, size, mtime, is_current)"
          ls -1 "$APP/releases" | while read -r r; do
            d="$APP/releases/$r"
            canon="$(readlink -f "$d")"
            cur=no; [ "$canon" = "$CUR" ] && cur=YES
            printf '%s\t%s\t%s\tcurrent=%s\n' "$r" "$(sz "$d")" "$(stat -c %y "$d" | cut -d. -f1)" "$cur"
          done | sort -t$'\t' -k3 -r
          echo "RELEASE_COUNT=$(ls -1 "$APP/releases" | wc -l)"
          echo "RELEASES_TOTAL=$(sz "$APP/releases")"

          sec "PARTIAL RELEASE FROM THE FAILED DEPLOY (target SHA)"
          ls -ld "$APP/releases/eb815065786528293c36ce5123b7ca8248637721" 2>&1 | head -2
          echo "SIZE=$(sz "$APP/releases/eb815065786528293c36ce5123b7ca8248637721")"
          echo "INCOMING_LEFTOVERS:"; ls -1d "$APP"/.incoming-* 2>/dev/null | while read -r p; do printf '%s\t%s\n' "$(sz "$p")" "$p"; done

          sec "DEPLOY HISTORY HINTS (backup directory names and sizes only)"
          ls -1t "$APP/backups" 2>/dev/null | head -20 | while read -r b; do printf '%s\t%s\t%s\n' "$(sz "$APP/backups/$b")" "$(stat -c %y "$APP/backups/$b" | cut -d. -f1)" "$b"; done
          echo "BACKUPS_TOTAL=$(sz "$APP/backups")"
          echo "M2_12F_BACKUPS_TOTAL=$(sz "$HOME/m2-12f-backups")"
          ls -1d "$HOME"/*backup* "$HOME"/*/*backup* 2>/dev/null | head -10

          sec "SHARED STORAGE"
          echo "SHARED_TOTAL=$(sz "$APP/shared")"
          for p in "$APP"/shared/* "$APP"/shared/storage/*; do [ -e "$p" ] && printf '%s\t%s\n' "$(sz "$p")" "$p"; done | sort -rh | head -12

          sec "LOGS (sizes only)"
          for p in "$APP"/shared/storage/logs "$APP"/current/backend/storage/logs "$HOME/logs" "$HOME/domains/a3.ciptagrafika.com/logs"; do [ -e "$p" ] && printf '%s\t%s\n' "$(sz "$p")" "$p"; done
          find "$APP" -maxdepth 6 -name '*.log' -type f -size +10M -printf '%s bytes\t%p\n' 2>/dev/null | head -10

          sec "COMPOSER AND OTHER CACHES"
          for p in "$HOME/.composer" "$HOME/.cache" "$HOME/.cache/composer" "$HOME/.config/composer" "$HOME/.npm" "$HOME/tmp" "$HOME/.local" "$APP/runtimes"; do [ -e "$p" ] && printf '%s\t%s\n' "$(sz "$p")" "$p"; done

          sec "OTHER LARGE DIRECTORIES UNDER HOME (depth 2, >50M)"
          du -h --max-depth=2 "$HOME" 2>/dev/null | awk '{ if ($1 ~ /[0-9]G$/ || ($1 ~ /M$/ && $1+0 >= 50)) print }' | sort -rh | head -25

          sec "PUBLIC_HTML SIZE"
          echo "PUBLIC_HTML=$(sz "$HOME/domains/a3.ciptagrafika.com/public_html")"
          echo; echo "INSPECTION=READ_ONLY_COMPLETE"
          REMOTE
